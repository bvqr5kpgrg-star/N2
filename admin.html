<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dreamify Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --gold: #d8b46a;
  --gold-light: #f0d898;
  --gold-dim: rgba(216,180,106,0.12);
  --dark: #07111f;
  --darker: #040c17;
  --mid: #0e1e30;
  --card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #e8dcc8;
  --muted: #7a8a9a;
  --success: #5ebd82;
  --danger: #e05555;
  --warning: #e0a044;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; background:var(--darker); color:var(--text); min-height:100vh; cursor:none; }

/* CURSOR */
.cursor { position:fixed; width:8px; height:8px; background:var(–gold); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); }
.cursor-ring { position:fixed; width:30px; height:30px; border:1px solid rgba(216,180,106,.35); border-radius:50%; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition:all .15s; }
.cursor-ring.big { width:46px; height:46px; border-color:var(–gold); background:rgba(216,180,106,.04); }

/* SIDEBAR */
.layout { display:flex; min-height:100vh; }
.sidebar {
width: 240px; flex-shrink: 0;
background: #070f1c;
border-right: 1px solid var(–border);
display: flex; flex-direction: column;
position: sticky; top: 0; height: 100vh;
overflow-y: auto;
}
.sidebar-brand {
padding: 28px 24px 20px;
font-family: ‘Cormorant Garamond’, serif;
font-size: 1.6rem;
font-weight: 300;
letter-spacing: 0.2em;
color: var(–gold);
border-bottom: 1px solid var(–border);
}
.sidebar-sub { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(–muted); margin-top: 2px; }
.nav-section { padding: 20px 16px 8px; font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(–muted); }
.nav-item {
display: flex; align-items: center; gap: 10px;
padding: 10px 16px;
margin: 2px 8px;
color: var(–muted);
font-size: 0.8rem;
text-decoration: none;
cursor: none;
transition: all .2s;
border-left: 2px solid transparent;
}
.nav-item:hover, .nav-item.active { color: var(–gold); border-left-color: var(–gold); background: var(–gold-dim); }
.nav-item svg { flex-shrink: 0; }
.sidebar-footer {
margin-top: auto;
padding: 20px 16px;
border-top: 1px solid var(–border);
}
.view-site {
display: flex; align-items: center; gap: 8px;
color: var(–muted); text-decoration: none; font-size: 0.72rem;
transition: color .2s; cursor: none;
}
.view-site:hover { color: var(–gold); }

/* MAIN */
.main { flex: 1; overflow-y: auto; }
.topbar {
position: sticky; top: 0; z-index: 100;
background: rgba(4,12,23,0.9);
backdrop-filter: blur(16px);
border-bottom: 1px solid var(–border);
padding: 0 40px;
height: 60px;
display: flex; align-items: center; justify-content: space-between;
}
.page-title { font-family:‘Cormorant Garamond’,serif; font-size:1.2rem; font-weight:300; color:var(–gold-light); letter-spacing:0.08em; }
.topbar-right { display:flex; align-items:center; gap:16px; }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(–success); box-shadow:0 0 8px rgba(94,189,130,.5); }
.status-text { font-size:0.68rem; letter-spacing:0.1em; color:var(–muted); }

/* CONTENT */
.content { padding: 32px 40px 60px; max-width: 1100px; }

/* STATS ROW */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
.stat-card {
background: var(–card);
border: 1px solid var(–border);
padding: 20px;
position: relative;
overflow: hidden;
}
.stat-card::before {
content:’’; position:absolute; top:0; left:0; right:0; height:2px;
background: linear-gradient(to right, var(–gold-dim), var(–gold));
}
.stat-label { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(–muted); margin-bottom:8px; }
.stat-value { font-family:‘Cormorant Garamond’,serif; font-size:2rem; font-weight:300; color:var(–gold); line-height:1; }
.stat-sub { font-size:0.65rem; color:var(–muted); margin-top:4px; }

/* SECTION CARD */
.section-card {
background: var(–card);
border: 1px solid var(–border);
margin-bottom: 24px;
}
.section-head {
padding: 20px 24px;
border-bottom: 1px solid var(–border);
display: flex; justify-content: space-between; align-items: center;
}
.section-title {
font-family:‘Cormorant Garamond’,serif;
font-size:1.1rem; font-weight:400;
color:var(–gold-light); letter-spacing:0.05em;
}
.section-body { padding: 24px; }

/* FORM GRID */
.form-grid { display:grid; gap:14px; grid-template-columns:1fr 1fr; }
.form-grid.three { grid-template-columns:1fr 1fr 1fr; }
.form-grid.full { grid-template-columns:1fr; }
.field { display:flex; flex-direction:column; gap:6px; }
.field.span2 { grid-column: span 2; }
.field.span3 { grid-column: span 3; }
label { font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:var(–muted); }
input[type=“text”],input[type=“number”],input[type=“url”],select,textarea {
padding: 10px 14px;
background: var(–mid);
border: 1px solid var(–border);
color: var(–text);
font-family:‘DM Sans’,sans-serif;
font-size: 0.82rem;
outline: none;
transition: border-color .25s;
width: 100%;
}
input::placeholder, textarea::placeholder { color: var(–muted); }
input:focus, select:focus, textarea:focus { border-color: rgba(216,180,106,.4); }
textarea { min-height: 80px; resize: vertical; }
select option { background: var(–mid); }

/* FILE INPUT */
.file-zone {
border: 1px dashed rgba(216,180,106,.25);
padding: 20px;
text-align: center;
cursor: none;
transition: border-color .25s, background .25s;
}
.file-zone:hover { border-color: var(–gold); background: var(–gold-dim); }
.file-zone input { display:none; }
.file-zone-text { font-size:0.7rem; letter-spacing:0.1em; color:var(–muted); }
.file-zone-icon { font-size:24px; margin-bottom:6px; }
.img-preview {
width: 90px; height: 90px;
object-fit: cover;
border: 1px solid var(–border);
display: none;
}
.img-preview.show { display:block; }

/* BUTTONS */
.btn {
padding: 11px 24px;
font-family:‘DM Sans’,sans-serif;
font-size:0.7rem;
font-weight:500;
letter-spacing:0.18em;
text-transform:uppercase;
border: 1px solid transparent;
cursor: none;
transition: all .25s;
display:inline-flex; align-items:center; gap:8px;
}
.btn-gold { background:var(–gold); color:var(–darker); border-color:var(–gold); }
.btn-gold:hover { background:var(–gold-light); }
.btn-outline { background:transparent; border-color:var(–border); color:var(–muted); }
.btn-outline:hover { border-color:var(–gold); color:var(–gold); }
.btn-danger-outline { background:transparent; border-color:rgba(224,85,85,.35); color:var(–danger); }
.btn-danger-outline:hover { background:rgba(224,85,85,.08); border-color:var(–danger); }
.btn-sm { padding:7px 14px; font-size:0.62rem; }
.btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }

/* TABLE */
.table-wrap { overflow-x: auto; }
table { width:100%; border-collapse:collapse; }
thead th {
padding: 10px 14px;
font-size: 0.58rem;
letter-spacing: 0.25em;
text-transform: uppercase;
color: var(–muted);
border-bottom: 1px solid var(–border);
text-align: left;
white-space: nowrap;
}
tbody tr { border-bottom: 1px solid rgba(255,255,255,.04); transition: background .2s; }
tbody tr:hover { background: rgba(216,180,106,.03); }
td { padding: 14px; vertical-align: middle; font-size: 0.8rem; }
.thumb {
width: 50px; height: 50px;
object-fit: cover;
border: 1px solid var(–border);
}
.emoji-cell { font-size:28px; line-height:1; }
.product-name { font-family:‘Cormorant Garamond’,serif; font-size:1rem; color:#f0e8d4; }
.product-desc { font-size:0.68rem; color:var(–muted); margin-top:2px; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge {
display:inline-block; padding:3px 10px;
font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase;
border: 1px solid rgba(216,180,106,.3); color:var(–gold);
}
.chip {
display:inline-block; padding:3px 10px;
font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase;
}
.chip-in { border:1px solid rgba(94,189,130,.3); color:#5ebd82; }
.chip-low { border:1px solid rgba(224,160,68,.3); color:var(–warning); }
.chip-out { border:1px solid var(–border); color:var(–muted); }
.price-cell { font-family:‘Cormorant Garamond’,serif; font-size:1rem; color:var(–gold); }
.price-old { font-size:0.7rem; color:var(–muted); text-decoration:line-through; }
.action-row { display:flex; gap:6px; }
.no-products { padding:60px; text-align:center; color:var(–muted); font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; }

/* TOAST */
.toast-wrap { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none; }
.toast {
background:var(–mid); border:1px solid var(–gold);
color:var(–text); font-size:0.74rem; letter-spacing:0.06em;
padding:10px 20px; display:flex; align-items:center; gap:8px;
transform:translateX(20px); opacity:0; transition:all .3s cubic-bezier(.16,1,.3,1);
}
.toast.show { transform:translateX(0); opacity:1; }
.toast-dot { width:5px; height:5px; border-radius:50%; background:var(–gold); flex-shrink:0; }
.toast.error { border-color:var(–danger); }
.toast.error .toast-dot { background:var(–danger); }
</style>

</head>

<script>
// ── CURSOR ──────────────────────────────────────────────
const cursor=document.getElementById('cursor'),ring=document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function a(){cursor.style.left=mx+'px';cursor.style.top=my+'px';rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(a);})();
document.querySelectorAll('button,a,.file-zone').forEach(el=>{
  el.addEventListener('mouseenter',()=>ring.classList.add('big'));
  el.addEventListener('mouseleave',()=>ring.classList.remove('big'));
});

// ── DEFAULTS ────────────────────────────────────────────
const DEFAULT_PRODUCTS=[
  {id:1,name:"Premium Baby Outfit",category:"Baby",price:220,oldPrice:280,stock:"in",emoji:"👶",image:"",tag:"New",description:"Soft and comfortable baby outfit perfect for any occasion."},
  {id:2,name:"Rasees Rose Perfume",category:"Perfume",price:180,oldPrice:220,stock:"low",emoji:"🌸",image:"",tag:"Best Seller",description:"Elegant rose fragrance, long-lasting and deeply feminine."}
];
const DEFAULT_INFO={brandName:"Dreamify",heroText:"Premium boutique shopping experience",whatsapp:"960000000"};
if(!localStorage.getItem("dreamifyProducts")) localStorage.setItem("dreamifyProducts",JSON.stringify(DEFAULT_PRODUCTS));
if(!localStorage.getItem("dreamifyInfo")) localStorage.setItem("dreamifyInfo",JSON.stringify(DEFAULT_INFO));

let products = JSON.parse(localStorage.getItem("dreamifyProducts"));

// ── SECTION NAV ─────────────────────────────────────────
function showSection(name, el){
  ['products','settings'].forEach(s=>{
    document.getElementById('section-'+s).style.display=s===name?'block':'none';
  });
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('pageTitle').textContent=name.charAt(0).toUpperCase()+name.slice(1);
  if(name==='settings') loadInfo();
}

// ── STORAGE ─────────────────────────────────────────────
function save(){ localStorage.setItem("dreamifyProducts",JSON.stringify(products)); updateStats(); renderTable(); }

// ── STATS ────────────────────────────────────────────────
function updateStats(){
  document.getElementById('statTotal').textContent=products.length;
  document.getElementById('statIn').textContent=products.filter(p=>p.stock==='in').length;
  document.getElementById('statLow').textContent=products.filter(p=>p.stock==='low').length;
  document.getElementById('statOut').textContent=products.filter(p=>p.stock==='out').length;
  document.getElementById('productCountLabel').textContent=products.length+' product'+(products.length!==1?'s':'');
}

// ── INFO ─────────────────────────────────────────────────
function loadInfo(){
  const info=JSON.parse(localStorage.getItem("dreamifyInfo"))||DEFAULT_INFO;
  document.getElementById("brandName").value=info.brandName||'';
  document.getElementById("heroText").value=info.heroText||'';
  document.getElementById("whatsapp").value=info.whatsapp||'';
}
function saveInfo(){
  const info={
    brandName:document.getElementById("brandName").value.trim(),
    heroText:document.getElementById("heroText").value.trim(),
    whatsapp:document.getElementById("whatsapp").value.trim()
  };
  localStorage.setItem("dreamifyInfo",JSON.stringify(info));
  toast("Site settings saved");
}

// ── IMAGE ─────────────────────────────────────────────────
function uploadImage(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{ document.getElementById("imageUrl").value=ev.target.result; showPreview(ev.target.result); };
  r.readAsDataURL(f);
}
function previewFromUrl(){
  const v=document.getElementById("imageUrl").value.trim();
  showPreview(v);
}
function showPreview(src){
  const el=document.getElementById("imgPreview");
  if(src){ el.src=src; el.classList.add("show"); }
  else { el.src=''; el.classList.remove("show"); }
}
function removeImage(){
  document.getElementById("imageUrl").value="";
  document.getElementById("imageFile").value="";
  showPreview("");
}

// ── PRODUCT FORM ─────────────────────────────────────────
function saveProduct(){
  const id=document.getElementById("productId").value;
  const name=document.getElementById("name").value.trim();
  const price=Number(document.getElementById("price").value);
  if(!name||!price){ toast("Name and price are required","error"); return; }

  const product={
    id: id ? Number(id) : Date.now(),
    name,
    category: document.getElementById("category").value,
    price,
    oldPrice: Number(document.getElementById("oldPrice").value)||0,
    stock: document.getElementById("stock").value,
    emoji: document.getElementById("emoji").value.trim()||"🛍️",
    image: document.getElementById("imageUrl").value.trim(),
    tag: document.getElementById("tag").value.trim()||"New",
    description: document.getElementById("description").value.trim()
  };

  if(id){ products=products.map(p=>p.id===Number(id)?product:p); toast("Product updated"); }
  else { products.push(product); toast("Product added"); }
  save(); clearForm();
}

function editProduct(id){
  const p=products.find(p=>p.id===id); if(!p) return;
  document.getElementById("formTitle").textContent="Edit Product";
  document.getElementById("productId").value=p.id;
  document.getElementById("name").value=p.name;
  document.getElementById("category").value=p.category;
  document.getElementById("price").value=p.price;
  document.getElementById("oldPrice").value=p.oldPrice||"";
  document.getElementById("stock").value=p.stock;
  document.getElementById("emoji").value=p.emoji||"";
  document.getElementById("tag").value=p.tag||"";
  document.getElementById("imageUrl").value=p.image||"";
  document.getElementById("description").value=p.description||"";
  showPreview(p.image||"");
  document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
}

function deleteProduct(id){
  if(!confirm("Delete this product?")) return;
  products=products.filter(p=>p.id!==id);
  save(); toast("Product deleted","error");
}

function clearForm(){
  document.getElementById("formTitle").textContent="Add New Product";
  ["productId","name","price","oldPrice","emoji","tag","imageUrl","description"].forEach(f=>{
    document.getElementById(f).value="";
  });
  document.getElementById("category").value="Baby";
  document.getElementById("stock").value="in";
  document.getElementById("imageFile").value="";
  showPreview("");
}

// ── TABLE ─────────────────────────────────────────────────
function renderTable(){
  const tb=document.getElementById("productTable");
  const np=document.getElementById("noProducts");
  if(products.length===0){ tb.innerHTML=""; np.style.display="block"; return; }
  np.style.display="none";
  tb.innerHTML=products.map(p=>{
    const discount=p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
    const chipClass=p.stock==="in"?"chip-in":p.stock==="low"?"chip-low":"chip-out";
    const stockLabel=p.stock==="in"?"In Stock":p.stock==="low"?"Limited":"Sold Out";
    return `<tr>
      <td>${p.image?`<img class="thumb" src="${p.image}" alt="">`:`<div class="emoji-cell">${p.emoji||'🛍️'}</div>`}</td>
      <td>
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.description||''}</div>
      </td>
      <td><span class="badge">${p.category}</span></td>
      <td>
        <div class="price-cell">MVR ${p.price}</div>
        ${p.oldPrice?`<div class="price-old">MVR ${p.oldPrice}</div>`:''}
        ${discount?`<div style="font-size:.6rem;color:#5ebd82;margin-top:2px;">−${discount}%</div>`:''}
      </td>
      <td><span class="chip ${chipClass}">${stockLabel}</span></td>
      <td>
        <div class="action-row">
          <button class="btn btn-outline btn-sm" onclick="editProduct(${p.id})">Edit</button>
          <button class="btn btn-danger-outline btn-sm" onclick="deleteProduct(${p.id})">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join("");
}

// ── TOAST ─────────────────────────────────────────────────
function toast(msg, type=""){
  const wrap=document.getElementById("toastWrap");
  const t=document.createElement("div");
  t.className="toast"+(type?" "+type:"");
  t.innerHTML=`<div class="toast-dot"></div>${msg}`;
  wrap.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add("show")));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),350); },2600);
}

// ── INIT ─────────────────────────────────────────────────
updateStats();
renderTable();
</script>

</body>
</html>
