<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamify Store</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}
header{
  padding:25px;
  text-align:center;
  background:linear-gradient(135deg,#07111f,#13243a);
}
h1{color:#d8b46a}
.container{max-width:1200px;margin:auto;padding:20px}
.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
input,select,button{
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
}
input,select{
  background:#111827;
  color:white;
}
button{
  background:#d8b46a;
  color:#07111f;
  font-weight:bold;
  cursor:pointer;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}
.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  overflow:hidden;
}
.image-box{
  height:240px;
  background:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.image-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.emoji{font-size:60px}
.info{padding:15px}
.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#d8b46a;
  color:#07111f;
  font-size:12px;
  font-weight:bold;
}
.price{
  color:#d8b46a;
  font-size:20px;
  font-weight:bold;
}
.old{
  color:#aaa;
  text-decoration:line-through;
  margin-left:8px;
}
.cart{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#d8b46a;
  color:#07111f;
  padding:15px 20px;
  border-radius:50px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1 id="brandName">Dreamify</h1>
  <p id="heroText">Premium boutique shopping experience</p>
  <a href="admin.html" style="color:#d8b46a">Admin Panel</a>
</header>

<div class="container">
  <div class="top">
    <input id="search" placeholder="Search product..." oninput="renderProducts()">
    <select id="category" onchange="renderProducts()">
      <option value="all">All Categories</option>
      <option value="Baby">Baby</option>
      <option value="Perfume">Perfume</option>
      <option value="Fashion">Fashion</option>
      <option value="Offer">Offer</option>
    </select>
  </div>

  <div class="grid" id="productGrid"></div>
</div>

<div class="cart" onclick="sendOrder()">Order WhatsApp</div>

<script>
const DEFAULT_PRODUCTS = [
  {
    id:1,
    name:"Premium Baby Outfit",
    category:"Baby",
    price:220,
    oldPrice:280,
    stock:"in",
    emoji:"👶",
    image:"",
    tag:"New",
    description:"Soft and comfortable baby outfit."
  },
  {
    id:2,
    name:"Rasees Rose Perfume",
    category:"Perfume",
    price:180,
    oldPrice:220,
    stock:"low",
    emoji:"🌸",
    image:"",
    tag:"Best Seller",
    description:"Elegant rose fragrance."
  }
];

const DEFAULT_INFO = {
  brandName:"Dreamify",
  heroText:"Premium boutique shopping experience",
  whatsapp:"960000000"
};

if(!localStorage.getItem("dreamifyProducts")){
  localStorage.setItem("dreamifyProducts",JSON.stringify(DEFAULT_PRODUCTS));
}

if(!localStorage.getItem("dreamifyInfo")){
  localStorage.setItem("dreamifyInfo",JSON.stringify(DEFAULT_INFO));
}

let cart = [];

function getProducts(){
  return JSON.parse(localStorage.getItem("dreamifyProducts")) || DEFAULT_PRODUCTS;
}

function getInfo(){
  return JSON.parse(localStorage.getItem("dreamifyInfo")) || DEFAULT_INFO;
}

function loadInfo(){
  const info = getInfo();
  document.getElementById("brandName").innerText = info.brandName || "Dreamify";
  document.getElementById("heroText").innerText = info.heroText || "";
}

function renderProducts(){
  const products = getProducts();
  const search = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("category").value;

  let list = products.filter(p=>{
    const matchSearch = p.name.toLowerCase().includes(search);
    const matchCategory = category === "all" || p.category === category;
    return matchSearch && matchCategory;
  });

  document.getElementById("productGrid").innerHTML = list.map(p=>`
    <div class="card">
      <div class="image-box">
        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<div class="emoji">${p.emoji || "🛍️"}</div>`}
      </div>

      <div class="info">
        <span class="badge">${p.tag || "New"}</span>
        <h3>${p.name}</h3>
        <p>${p.description || ""}</p>
        <p>${p.stock === "out" ? "Sold Out" : p.stock === "low" ? "Limited Stock" : "In Stock"}</p>

        <div>
          <span class="price">MVR ${p.price}</span>
          ${p.oldPrice ? `<span class="old">MVR ${p.oldPrice}</span>` : ""}
        </div>

        <br>

        <button onclick="addToCart(${p.id})" ${p.stock==="out"?"disabled":""}>
          ${p.stock==="out"?"Sold Out":"Add to Order"}
        </button>
      </div>
    </div>
  `).join("");
}

function addToCart(id){
  const product = getProducts().find(p=>p.id===id);
  if(!product)return;

  const existing = cart.find(i=>i.id===id);
  if(existing){
    existing.qty++;
  }else{
    cart.push({...product,qty:1});
  }

  alert(product.name + " added to order");
}

function sendOrder(){
  const info = getInfo();

  if(cart.length === 0){
    alert("Please add product first");
    return;
  }

  const lines = cart.map(i=>`• ${i.name} x${i.qty} - MVR ${i.price*i.qty}`).join("%0A");
  const total = cart.reduce((sum,i)=>sum + i.price*i.qty,0);

  const msg = `Hello ${info.brandName},%0A%0AI would like to order:%0A${lines}%0A%0ATotal: MVR ${total}`;
  window.open(`https://wa.me/${info.whatsapp}?text=${msg}`,"_blank");
}

loadInfo();
renderProducts();
</script>

</body>
</html>
